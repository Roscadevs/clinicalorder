version: '3.8'

services:
  # Base de Datos PostgreSQL 15 Local con persistencia en volumen
  postgres:
    image: postgres:15-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: clinica_dermatologica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_dermatologica"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Spring Boot (Java 17) con Clean Architecture y Flyway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clinica_dermatologica?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu archivo .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?define JWT_SECRET_KEY en tu archivo .env}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:?define MERCADOPAGO_PUBLIC_KEY en tu archivo .env}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:?define MERCADOPAGO_ACCESS_TOKEN en tu archivo .env}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:?define MERCADOPAGO_WEBHOOK_SECRET en tu archivo .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?define GEMINI_API_KEY en tu archivo .env}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - SUPABASE_STORAGE_URL=${SUPABASE_STORAGE_URL:?define SUPABASE_STORAGE_URL en tu archivo .env}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?define SUPABASE_ANON_KEY en tu archivo .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React (Vite 5 + TypeScript + Tailwind)
  frontend:
    image: node:20-alpine
    container_name: clinica-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
      - VITE_SUPABASE_URL=${SUPABASE_URL:?define SUPABASE_URL en tu archivo .env}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?define SUPABASE_ANON_KEY en tu archivo .env}
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:?define AES_ENCRYPTION_KEY en tu archivo .env}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

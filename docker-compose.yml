version: '3.8'

services:
  # Base de Datos PostgreSQL 15 Local con persistencia en volumen
  postgres:
    image: postgres:15-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: clinica_dermatologica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_dermatologica"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Spring Boot (Java 17) con Clean Architecture y Flyway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clinica_dermatologica?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - JWT_SECRET_KEY=MiClaveSecretaSuperSeguraParaLaClinicaDermatologica2026EsteticaYSalud
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-TEST-0000000000000000-000000-00000000000000000000000000000000-000000000}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-test_webhook_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JtRjMndLmRpDeKhB60q8XernnuMzaJXyWk99XmT7zI4A}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - SUPABASE_STORAGE_URL=${SUPABASE_STORAGE_URL:-https://jcsgixxatmqzpdcflevw.supabase.co/storage/v1}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_vCQ09c8ZXEKvQeNipnC5gA_d8VQnASl}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React (Vite 5 + TypeScript + Tailwind)
  frontend:
    image: node:20-alpine
    container_name: clinica-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
      - VITE_SUPABASE_URL=${SUPABASE_URL:-https://jcsgixxatmqzpdcflevw.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_vCQ09c8ZXEKvQeNipnC5gA_d8VQnASl}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
